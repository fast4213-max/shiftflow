<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>shiftflow - 勤務表アップロード</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 16px;
      color: #222;
    }
    h1 { font-size: 1.3rem; }
    #status { margin-top: 12px; white-space: pre-wrap; }

    #calendar-section { margin-top: 24px; }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-top: 12px;
    }
    .weekday-header {
      text-align: center;
      font-weight: bold;
      font-size: 0.8rem;
      padding: 4px 0;
    }
    .day-cell {
      border: 1px solid #ccc;
      border-radius: 4px;
      min-height: 96px;
      padding: 4px;
      font-size: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .day-cell.empty { border: none; }
    .day-cell .date-line { font-weight: bold; }
    .day-cell .weekday-line { color: #666; }
    .day-cell select { width: 100%; font-size: 0.75rem; }
    .day-cell .time-line { color: #0a6; }

    #confirm-button { margin-top: 16px; }
  </style>
</head>
<body>
  <h1>shiftflow: 勤務表PDFアップロード</h1>

  <form id="upload-form">
    <input type="file" name="shiftPdf" accept="application/pdf" required />
    <button type="submit">読み込む</button>
  </form>

  <div id="status"></div>

  <div id="calendar-section" hidden>
    <p>内容を確認してください。勤務番号を変更すると出退勤時間も自動で変わります。問題なければ「登録する」を押してください。</p>
    <div class="calendar-grid" id="calendar-grid"></div>
    <button id="confirm-button">登録する</button>
  </div>

  <script>
    const WEEKDAY_ORDER = ["日", "月", "火", "水", "木", "金", "土"];

    const form = document.getElementById("upload-form");
    const statusEl = document.getElementById("status");
    const calendarSection = document.getElementById("calendar-section");
    const calendarGrid = document.getElementById("calendar-grid");
    const confirmButton = document.getElementById("confirm-button");

    let currentRows = [];
    let masterList = [];

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      statusEl.textContent = "読み込み中...";
      calendarSection.hidden = true;

      const formData = new FormData(form);
      try {
        const [parseRes, masterRes] = await Promise.all([
          fetch("/api/parse", { method: "POST", body: formData }),
          fetch("/api/master"),
        ]);

        const parseData = await parseRes.json();
        if (!parseRes.ok) {
          statusEl.textContent = "エラー: " + parseData.error;
          return;
        }

        const masterData = await masterRes.json();
        masterList = masterData.master || [];
        currentRows = parseData.rows;

        renderCalendar(currentRows);
        statusEl.textContent = "";
        calendarSection.hidden = false;
      } catch (err) {
        statusEl.textContent = "エラー: " + err.message;
      }
    });

    function findMasterEntry(code) {
      return masterList.find((m) => m.code === String(code));
    }

    function timeLabel(code) {
      const entry = findMasterEntry(code);
      if (!entry) return "";
      if (entry.startTime && entry.endTime) {
        return `${entry.startTime}〜${entry.endTime}`;
      }
      return entry.isHoliday ? "休日" : "";
    }

    function renderCalendar(rows) {
      calendarGrid.innerHTML = "";

      for (const w of WEEKDAY_ORDER) {
        const header = document.createElement("div");
        header.className = "weekday-header";
        header.textContent = w;
        calendarGrid.appendChild(header);
      }

      if (rows.length > 0) {
        const leadingBlanks = WEEKDAY_ORDER.indexOf(rows[0].weekday);
        for (let i = 0; i < leadingBlanks; i++) {
          const blank = document.createElement("div");
          blank.className = "day-cell empty";
          calendarGrid.appendChild(blank);
        }
      }

      rows.forEach((row, index) => {
        calendarGrid.appendChild(buildDayCell(row, index));
      });
    }

    function buildDayCell(row, index) {
      const cell = document.createElement("div");
      cell.className = "day-cell";

      const dateLine = document.createElement("div");
      dateLine.className = "date-line";
      dateLine.textContent = row.date;
      cell.appendChild(dateLine);

      const weekdayLine = document.createElement("div");
      weekdayLine.className = "weekday-line";
      weekdayLine.textContent = row.weekday;
      cell.appendChild(weekdayLine);

      const select = document.createElement("select");
      const rawOption = document.createElement("option");
      rawOption.value = row.duty;
      rawOption.textContent = row.duty + "(PDFのまま)";
      select.appendChild(rawOption);

      for (const entry of masterList) {
        const option = document.createElement("option");
        option.value = entry.code;
        option.textContent = `${entry.code}: ${entry.duty}`;
        if (entry.code === String(row.duty)) {
          option.selected = true;
          rawOption.selected = false;
        }
        select.appendChild(option);
      }
      cell.appendChild(select);

      const timeLine = document.createElement("div");
      timeLine.className = "time-line";
      timeLine.textContent = timeLabel(select.value);
      cell.appendChild(timeLine);

      select.addEventListener("change", () => {
        currentRows[index].duty = select.value;
        timeLine.textContent = timeLabel(select.value);
      });

      return cell;
    }

    confirmButton.addEventListener("click", async () => {
      statusEl.textContent = "登録中...";
      try {
        const res = await fetch("/api/confirm", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ rows: currentRows }),
        });
        const data = await res.json();

        if (!res.ok) {
          statusEl.textContent = "エラー: " + data.error;
          return;
        }

        statusEl.textContent = "スプレッドシート登録・カレンダー反映が完了しました。";
      } catch (err) {
        statusEl.textContent = "エラー: " + err.message;
      }
    });
  </script>
</body>
</html>
