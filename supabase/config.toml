# Supabase CLI の設定(ローカル開発とデプロイ用)
# project_id はローカルでの識別名。本番のプロジェクトは `supabase link` で指定する。
project_id = "shiftflow"

[api]
schemas = ["public"]

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "http://localhost:8000"
# ユーザーは Edge Function(sign-up / admin-login)だけが作る。画面から直接の新規登録は受け付けない
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

# Edge Functions は関数の中でトークンを確かめる(新しい署名鍵方式でも動くように、ゲートウェイの検証は切る)
[functions.login]
verify_jwt = false
[functions.sign-up]
verify_jwt = false
[functions.admin-login]
verify_jwt = false
[functions.admin-users]
verify_jwt = false
[functions.change-pin]
verify_jwt = false
[functions.app-config]
verify_jwt = false
[functions.verify-calendar]
verify_jwt = false
[functions.register-month]
verify_jwt = false
[functions.delete-month]
verify_jwt = false
[functions.sync-holidays]
verify_jwt = false

[functions.contact]
verify_jwt = false

[functions.admin-contact]
verify_jwt = false

[functions.mail-inbound]
verify_jwt = false
