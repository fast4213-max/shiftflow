<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      color: #222;
      background: #f5f5f5;
    }
    header {
      position: sticky; top: 0; z-index: 1;
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; background: #fff; border-bottom: 1px solid #ddd;
    }
    header h1 { margin: 0; font-size: 1.1rem; }
    header button { font-size: 1.1rem; padding: 6px 14px; }
    main { max-width: 560px; margin: 0 auto; padding: 0 8px 96px; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th {
      position: sticky; top: 49px;
      background: #fafafa; color: #666;
      font-size: 0.8rem; font-weight: normal;
      padding: 6px 4px; border-bottom: 1px solid #ddd;
      white-space: nowrap;
    }
    td { padding: 4px; border-bottom: 1px solid #eee; text-align: center; vertical-align: middle; }
    tr.today td { background: #e8f0fe; }
    .day { width: 32px; font-weight: bold; font-size: 1.05rem; }
    .weekday { width: 28px; }
    .weekday.red { color: #c62828; }
    .type button {
      width: 36px; padding: 6px 0; font-size: 0.9rem;
      border: 1px solid #bbb; border-radius: 4px; background: #fff;
    }
    .type button.holiday { background: #fdecea; color: #c62828; border-color: #e57373; }
    .type button.override { font-weight: bold; box-shadow: 0 0 0 2px #1a73e8; }
    .code { text-align: left; }
    .code select, .code input, .memo input { font-size: 1rem; padding: 6px 4px; }
    .code select { width: 80px; }
    .code input { width: 80px; margin-top: 4px; display: block; }
    .offduty { color: #666; padding-left: 4px; }
    .memo input { width: 116px; }
    .memo input.override { color: #1a73e8; font-weight: bold; }
    footer {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 10px 12px; background: #fff; border-top: 1px solid #ddd;
      display: flex; align-items: center; gap: 12px;
    }
    footer button { font-size: 1.1rem; padding: 10px 24px; }
    #status { flex: 1; font-size: 0.9rem; }
    #status.error { color: #c62828; }
  </style>
</head>
<body>
  <header>
    <button id="prev">◀</button>
    <h1 id="title"></h1>
    <button id="next">▶</button>
  </header>
  <main>
    <table>
      <thead>
        <tr><th>日付</th><th>曜日</th><th>平/休</th><th>番号</th><th>メモ</th></tr>
      </thead>
      <tbody id="list"></tbody>
    </table>
  </main>
  <footer>
    <button id="register" disabled>登録</button>
    <span id="status">読み込み中…</span>
  </footer>

  <script>
    const MANUAL = "__manual__";
    const WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];

    const today = new Date();
    const firstMonth = { year: today.getFullYear(), month: today.getMonth() + 1 };
    const state = {
      year: firstMonth.year,
      month: firstMonth.month,
      data: null,
      master: {},
      dirty: false,
    };

    const $ = (id) => document.getElementById(id);

    function pad(n) { return (n < 10 ? "0" : "") + n; }
    function dateKey(y, m, d) { return y + "-" + pad(m) + "-" + pad(d); }
    function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
    function isFirstMonth() { return state.year === firstMonth.year && state.month === firstMonth.month; }

    function setStatus(text, isError) {
      $("status").textContent = text;
      $("status").className = isError ? "error" : "";
    }

    function load() {
      $("title").textContent = state.year + "年" + state.month + "月";
      $("prev").disabled = isFirstMonth();
      $("register").disabled = true;
      $("list").innerHTML = "";
      setStatus("読み込み中…");
      google.script.run
        .withSuccessHandler((data) => {
          state.data = data;
          state.master = {};
          data.master.forEach((m) => (state.master[m.code] = m));
          state.dirty = false;
          render();
          scrollToToday();
          $("register").disabled = false;
          setStatus("");
        })
        .withFailureHandler((err) => setStatus(err.message, true))
        .getMonthData(state.year, state.month);
    }

    // entries[key] = { code, dayType, memo }  dayType・memo は手修正したときだけ入れる
    function entryOf(key) {
      if (!state.data.entries[key]) state.data.entries[key] = { code: "", dayType: "", memo: "" };
      return state.data.entries[key];
    }

    function autoDayType(date) {
      const w = date.getDay();
      const isHoliday = w === 0 || w === 6 || state.data.holidays.indexOf(
        dateKey(date.getFullYear(), date.getMonth() + 1, date.getDate())) !== -1;
      return isHoliday ? "休日" : "平日";
    }

    // 泊は出勤時間だけ、日勤は「出勤〜退勤」
    function dutyMemo(entry, dayType) {
      const start = pickTime(entry.start, dayType);
      const end = pickTime(entry.end, dayType);
      return entry.type === "日勤" && start && end ? start + "〜" + end : start;
    }

    function pickTime(times, dayType) {
      return times[dayType] || times["平日"] || "";
    }

    function render() {
      const { year, month, data } = state;
      const list = $("list");
      list.innerHTML = "";

      for (let d = 1; d <= daysInMonth(year, month); d++) {
        const date = new Date(year, month - 1, d);
        const key = dateKey(year, month, d);
        const e = entryOf(key);
        const auto = autoDayType(date);
        const dayType = e.dayType || auto;

        const prevCode = d === 1 ? data.prevLastCode : (data.entries[dateKey(year, month, d - 1)] || {}).code;
        const prevMaster = state.master[prevCode];
        const offduty = prevMaster && prevMaster.type === "泊";
        if (offduty) e.code = "";

        const tr = document.createElement("tr");
        if (date.toDateString() === today.toDateString()) tr.className = "today";

        const dayTd = document.createElement("td");
        dayTd.className = "day";
        dayTd.textContent = d;
        tr.appendChild(dayTd);

        const weekdayTd = document.createElement("td");
        weekdayTd.className = "weekday" + (auto === "休日" ? " red" : "");
        weekdayTd.textContent = WEEKDAYS[date.getDay()];
        tr.appendChild(weekdayTd);

        // 平/休: 土日祝で自動。タップで切り替え(年末年始など)
        const typeTd = document.createElement("td");
        typeTd.className = "type";
        const typeButton = document.createElement("button");
        typeButton.textContent = dayType === "休日" ? "休" : "平";
        typeButton.className = (dayType === "休日" ? "holiday" : "") + (e.dayType ? " override" : "");
        typeButton.addEventListener("click", () => {
          const next = dayType === "休日" ? "平日" : "休日";
          e.dayType = next === auto ? "" : next;
          e.memo = "";
          changed();
        });
        typeTd.appendChild(typeButton);
        tr.appendChild(typeTd);

        const codeTd = document.createElement("td");
        codeTd.className = "code";
        tr.appendChild(codeTd);

        let autoMemo = "";
        if (offduty) {
          const span = document.createElement("span");
          span.className = "offduty";
          span.textContent = "非番";
          codeTd.appendChild(span);
          autoMemo = pickTime(prevMaster.end, dayType);
        } else {
          const entry = state.master[e.code];
          const isManual = e.code && !entry;
          const select = buildSelect(isManual ? MANUAL : e.code);
          select.addEventListener("change", () => {
            e.code = select.value === MANUAL ? " " : select.value;
            e.memo = "";
            changed();
            if (select.value === MANUAL) list.children[d - 1].querySelector(".code input").focus();
          });
          codeTd.appendChild(select);

          if (isManual) {
            const input = document.createElement("input");
            input.value = e.code.trim();
            input.placeholder = "入力";
            input.addEventListener("input", () => {
              // 空欄でも手入力モードを保つため空白1文字を入れておく(登録時は無視される)
              e.code = input.value || " ";
              state.dirty = true;
            });
            codeTd.appendChild(input);
          } else if (entry && entry.type !== "休日") {
            autoMemo = dutyMemo(entry, dayType);
          }
        }

        // メモ: 番号や平/休を選ぶと自動で入る。手で書き換えも可
        const memoTd = document.createElement("td");
        memoTd.className = "memo";
        const memoInput = document.createElement("input");
        memoInput.value = e.memo || autoMemo;
        memoInput.placeholder = autoMemo;
        if (e.memo) memoInput.className = "override";
        memoInput.addEventListener("input", () => {
          const value = memoInput.value.trim();
          e.memo = value === autoMemo ? "" : value;
          memoInput.className = e.memo ? "override" : "";
          state.dirty = true;
        });
        memoTd.appendChild(memoInput);
        tr.appendChild(memoTd);

        list.appendChild(tr);
      }
    }

    function changed() {
      state.dirty = true;
      render();
    }

    function scrollToToday() {
      const row = document.querySelector("#list tr.today");
      if (row) row.scrollIntoView({ block: "center" });
      else window.scrollTo(0, 0);
    }

    function buildSelect(selected) {
      const select = document.createElement("select");
      select.appendChild(new Option("", ""));

      const groups = [["勤務", (m) => m.type !== "休日"], ["休み", (m) => m.type === "休日"]];
      groups.forEach(([label, match]) => {
        const group = document.createElement("optgroup");
        group.label = label;
        state.data.master.filter(match).forEach((m) => group.appendChild(new Option(m.code, m.code)));
        select.appendChild(group);
      });
      select.appendChild(new Option("手入力…", MANUAL));

      select.value = selected;
      return select;
    }

    function moveMonth(delta) {
      if (delta < 0 && isFirstMonth()) return;
      if (state.dirty && !confirm("登録していない変更があります。移動しますか？")) return;
      const date = new Date(state.year, state.month - 1 + delta, 1);
      state.year = date.getFullYear();
      state.month = date.getMonth() + 1;
      load();
    }

    $("prev").addEventListener("click", () => moveMonth(-1));
    $("next").addEventListener("click", () => moveMonth(1));

    $("register").addEventListener("click", () => {
      const button = $("register");
      button.disabled = true;
      setStatus("登録中…");
      google.script.run
        .withSuccessHandler((result) => {
          state.dirty = false;
          button.disabled = false;
          setStatus(result.count + "件の予定を登録しました。");
        })
        .withFailureHandler((err) => {
          button.disabled = false;
          setStatus(err.message, true);
        })
        .register(state.year, state.month, state.data.entries);
    });

    load();
  </script>
</body>
</html>
