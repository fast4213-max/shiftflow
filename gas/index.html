<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      color: #222;
      background: #f5f5f5;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; background: #fff; border-bottom: 1px solid #ddd;
    }
    header h1 { margin: 0; font-size: 1.1rem; }
    header button { font-size: 1.1rem; padding: 6px 14px; }
    .scroller {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 12px 0;
      background: #fff;
      border-top: 1px solid #ddd;
      border-bottom: 1px solid #ddd;
    }
    table { border-collapse: collapse; }
    th, td {
      border: 1px solid #ddd;
      padding: 4px;
      text-align: center;
      white-space: nowrap;
    }
    th {
      position: sticky; left: 0; z-index: 1;
      background: #fafafa;
      font-size: 0.8rem;
      font-weight: normal;
      color: #666;
      min-width: 44px;
    }
    td { min-width: 72px; height: 40px; }
    td.holiday { background: #fdecea; color: #c62828; }
    td.today { outline: 2px solid #1a73e8; outline-offset: -2px; }
    .day { font-size: 1.1rem; font-weight: bold; }
    td select, td input { width: 64px; font-size: 1rem; padding: 4px 2px; }
    td input { margin-top: 4px; }
    .offduty { color: #666; }
    .memo { color: #666; font-size: 0.9rem; }
    footer {
      display: flex; align-items: center; gap: 12px;
      padding: 0 12px;
    }
    footer button { font-size: 1.1rem; padding: 10px 24px; }
    #status { flex: 1; font-size: 0.9rem; }
    #status.error { color: #c62828; }
  </style>
</head>
<body>
  <header>
    <button id="prev">◀</button>
    <h1 id="title"></h1>
    <button id="next">▶</button>
  </header>
  <div class="scroller" id="scroller">
    <table>
      <tr id="row-date"><th>日付</th></tr>
      <tr id="row-weekday"><th>曜日</th></tr>
      <tr id="row-code"><th>番号</th></tr>
      <tr id="row-memo"><th>メモ</th></tr>
    </table>
  </div>
  <footer>
    <button id="register" disabled>登録</button>
    <span id="status">読み込み中…</span>
  </footer>

  <script>
    const MANUAL = "__manual__";
    const WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];
    const ROWS = ["row-date", "row-weekday", "row-code", "row-memo"];

    const today = new Date();
    const firstMonth = { year: today.getFullYear(), month: today.getMonth() + 1 };
    const state = {
      year: firstMonth.year,
      month: firstMonth.month,
      data: null,
      master: {},
      dirty: false,
    };

    const $ = (id) => document.getElementById(id);

    function pad(n) { return (n < 10 ? "0" : "") + n; }
    function dateKey(y, m, d) { return y + "-" + pad(m) + "-" + pad(d); }
    function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
    function isFirstMonth() { return state.year === firstMonth.year && state.month === firstMonth.month; }

    function setStatus(text, isError) {
      $("status").textContent = text;
      $("status").className = isError ? "error" : "";
    }

    function clearTable() {
      ROWS.forEach((id) => {
        const row = $(id);
        while (row.children.length > 1) row.removeChild(row.lastChild);
      });
    }

    function load() {
      $("title").textContent = state.year + "年" + state.month + "月";
      $("prev").disabled = isFirstMonth();
      $("register").disabled = true;
      clearTable();
      setStatus("読み込み中…");
      google.script.run
        .withSuccessHandler((data) => {
          state.data = data;
          state.master = {};
          data.master.forEach((m) => (state.master[m.code] = m));
          state.dirty = false;
          render();
          scrollToToday();
          $("register").disabled = false;
          setStatus("");
        })
        .withFailureHandler((err) => setStatus(err.message, true))
        .getMonthData(state.year, state.month);
    }

    function isHoliday(date) {
      const w = date.getDay();
      return w === 0 || w === 6 || state.data.holidays.indexOf(
        dateKey(date.getFullYear(), date.getMonth() + 1, date.getDate())) !== -1;
    }

    function pickTime(times, date) {
      return times[isHoliday(date) ? "休日" : "平日"] || times["平日"] || "";
    }

    function cell(rowId, className) {
      const td = document.createElement("td");
      if (className) td.className = className;
      $(rowId).appendChild(td);
      return td;
    }

    // 日ごとに1列。日数(28〜31日)は月に合わせて変わる
    function render() {
      const { year, month, data } = state;
      clearTable();

      for (let d = 1; d <= daysInMonth(year, month); d++) {
        const date = new Date(year, month - 1, d);
        const key = dateKey(year, month, d);
        const prevValue = d === 1 ? data.prevLastEntry : data.entries[dateKey(year, month, d - 1)];
        const prevMaster = state.master[prevValue];
        const isToday = date.toDateString() === today.toDateString();
        const cls = (isHoliday(date) ? "holiday" : "") + (isToday ? " today" : "");

        const dayCell = cell("row-date", cls);
        dayCell.innerHTML = '<span class="day"></span>';
        dayCell.firstChild.textContent = d;
        dayCell.dataset.key = key;
        cell("row-weekday", cls).textContent = WEEKDAYS[date.getDay()];
        const codeCell = cell("row-code", isToday ? "today" : "");
        const memoCell = cell("row-memo", "memo" + (isToday ? " today" : ""));

        if (prevMaster && prevMaster.type === "泊") {
          delete data.entries[key];
          codeCell.innerHTML = '<span class="offduty">非番</span>';
          memoCell.textContent = pickTime(prevMaster.end, date);
          continue;
        }

        const current = data.entries[key] || "";
        const entry = state.master[current];
        const select = buildSelect(current && !entry ? MANUAL : current);
        codeCell.appendChild(select);

        if (current && !entry) {
          const input = document.createElement("input");
          input.value = current.trim();
          input.placeholder = "入力";
          input.addEventListener("input", () => {
            // 空欄でも手入力モードを保つため空白1文字を入れておく(登録時は無視される)
            data.entries[key] = input.value || " ";
            state.dirty = true;
          });
          codeCell.appendChild(document.createElement("br"));
          codeCell.appendChild(input);
        } else if (entry && entry.type !== "休日") {
          memoCell.textContent = pickTime(entry.start, date);
        }

        select.addEventListener("change", () => {
          if (select.value === MANUAL) {
            data.entries[key] = " ";
          } else if (select.value) {
            data.entries[key] = select.value;
          } else {
            delete data.entries[key];
          }
          state.dirty = true;
          const scrollLeft = $("scroller").scrollLeft;
          render();
          $("scroller").scrollLeft = scrollLeft;
          if (select.value === MANUAL) {
            $("row-code").children[d].querySelector("input").focus();
          }
        });
      }
    }

    function scrollToToday() {
      const target = document.querySelector("#row-date td.today");
      const scroller = $("scroller");
      scroller.scrollLeft = target ? target.offsetLeft - scroller.clientWidth / 3 : 0;
    }

    function buildSelect(selected) {
      const select = document.createElement("select");
      select.appendChild(new Option("", ""));

      const groups = [["勤務", (m) => m.type !== "休日"], ["休み", (m) => m.type === "休日"]];
      groups.forEach(([label, match]) => {
        const group = document.createElement("optgroup");
        group.label = label;
        state.data.master.filter(match).forEach((m) => group.appendChild(new Option(m.code, m.code)));
        select.appendChild(group);
      });
      select.appendChild(new Option("手入力…", MANUAL));

      select.value = selected;
      return select;
    }

    function moveMonth(delta) {
      if (delta < 0 && isFirstMonth()) return;
      if (state.dirty && !confirm("登録していない変更があります。移動しますか？")) return;
      const date = new Date(state.year, state.month - 1 + delta, 1);
      state.year = date.getFullYear();
      state.month = date.getMonth() + 1;
      load();
    }

    $("prev").addEventListener("click", () => moveMonth(-1));
    $("next").addEventListener("click", () => moveMonth(1));

    $("register").addEventListener("click", () => {
      const button = $("register");
      button.disabled = true;
      setStatus("登録中…");
      google.script.run
        .withSuccessHandler((result) => {
          state.dirty = false;
          button.disabled = false;
          setStatus(result.count + "件の予定を登録しました。");
        })
        .withFailureHandler((err) => {
          button.disabled = false;
          setStatus(err.message, true);
        })
        .register(state.year, state.month, state.data.entries);
    });

    load();
  </script>
</body>
</html>
