# supabase/ を変えて main に push すると、データベース(SQL)と Edge Functions を Supabase に反映する。
# 事前に GitHub の Settings → Secrets and variables → Actions に次の3つを登録しておくこと(README のセットアップ参照)。
#   SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_ID / SUPABASE_DB_PASSWORD
# 未登録のあいだは、何もせずに終わる(失敗にはしない)。
# 反映の前にテスト(lint・型チェック・テスト)を動かし、通らなかったときは反映しない。
name: Deploy Supabase

on:
  push:
    branches: [main]
    paths: ["supabase/**", "docs/contact/test/db_*", ".github/workflows/deploy-supabase.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  # test.yml と同じ内容。通ったときだけ deploy に進む
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno lint
        working-directory: supabase/functions
      - run: deno check */index.ts
        working-directory: supabase/functions
      - run: deno test --allow-read --allow-env supabase/functions

  # migration を、空の PostgreSQL に全部当てて、権限・RLS・動きを確かめる(docs/contact/test/db_assert.sql)。
  # 本物の Supabase の DB に反映する前に、migration の誤りや権限の外し忘れを見つける(pg_cron は無いので、そこは飛ばされる)
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - run: psql -v ON_ERROR_STOP=1 -q -c "create database t"
      - run: psql -v ON_ERROR_STOP=1 -q -d t -f docs/contact/test/db_stub.sql
      - run: |
          for f in supabase/migrations/*.sql; do
            echo "== $f"
            psql -v ON_ERROR_STOP=1 -q -d t -f "$f"
          done
      - run: psql -v ON_ERROR_STOP=1 -q -At -d t -f docs/contact/test/db_assert.sql

  deploy:
    needs: [test, database]
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub の Secrets(SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_ID / SUPABASE_DB_PASSWORD)が未登録のため、デプロイしませんでした。README のセットアップを参照してください。"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v5

      - if: steps.check.outputs.ready == 'true'
        uses: supabase/setup-cli@v3
        with:
          # latest だと、最新版を調べるときに GitHub の回数制限で落ちることがあるので、版を固定する
          # (上げたいときは、ここを書き換える)
          version: 2.119.0

      # SQL の反映(まだ反映していない migrations のファイルだけが実行される)
      - if: steps.check.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - if: steps.check.outputs.ready == 'true'
        run: supabase db push

      # Edge Functions(supabase/functions/ の全部)
      - if: steps.check.outputs.ready == 'true'
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
