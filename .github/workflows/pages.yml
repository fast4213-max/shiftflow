# web/ を GitHub Pages に公開する。
# 事前に リポジトリの Settings → Pages → Source を「GitHub Actions」にしておくこと。
name: GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      # CSS/JS の URL の ?v=dev を公開のたびに変わる値にする。
      # スマホのブラウザが古い JS をキャッシュから使い続け、新しい画面と合わずに止まるのを防ぐ。
      - run: |
          v="${GITHUB_SHA::8}"
          find web -name '*.html' -o -name '*.js' | xargs sed -i "s/?v=dev\"/?v=$v\"/g"
          if grep -rq '?v=dev"' web; then echo "::error::?v=dev が残っています"; exit 1; fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
