<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>勤務登録 - shiftflow</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#1a73e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="勤務登録">
  <link rel="stylesheet" href="css/app.css?v=dev">
  <link rel="stylesheet" href="css/shift.css?v=dev">
</head>
<body>
  <div class="month-header">
    <button id="prev" aria-label="前の月">◀</button>
    <div class="month-title"><h1 id="title"></h1></div>
    <button id="next" aria-label="次の月">▶</button>
  </div>
  <main class="shift">
    <table>
      <thead>
        <tr><th>日付</th><th>曜日</th><th>平/休</th><th>番号</th><th>メモ</th></tr>
      </thead>
      <tbody id="list"></tbody>
    </table>
  </main>
  <footer class="shift-footer">
    <button id="register" class="primary" disabled>登録</button>
    <span id="status">読み込み中…</span>
    <button id="reset" disabled>リセット</button>
  </footer>

  <dialog id="picker">
    <h2 id="picker-title"></h2>
    <h3>勤務</h3>
    <div class="grid" id="picker-duty"></div>
    <h3>休み</h3>
    <div class="grid" id="picker-off"></div>
    <div class="actions">
      <button id="picker-manual">手入力</button>
      <button id="picker-clear">クリア</button>
      <button id="picker-cancel">やめる</button>
    </div>
  </dialog>

  <dialog id="reset-dialog">
    <h2>カレンダーのリセット</h2>
    <p>選んだ月の、このアプリで登録した予定をカレンダーから削除し、画面の入力内容も空にします。手で入れた予定は消えません。</p>
    <input type="month" id="reset-month">
    <div class="actions">
      <button id="reset-cancel">やめる</button>
      <button id="reset-run">削除</button>
    </div>
  </dialog>

  <script type="module" src="js/input.js?v=dev" onerror="var e=document.getElementById('status'); e.textContent='画面を読み込めませんでした。電波の良いところで、ページを読み直してください。広告ブロック(コンテンツブロッカー)を使っているときは、このサイトではオフにしてください。'; e.className='error'"></script>
</body>
</html>
