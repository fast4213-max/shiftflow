<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ログイン - shiftflow</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#1a73e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="勤務登録">
  <link rel="stylesheet" href="css/app.css?v=dev">
</head>
<body>
  <main class="page narrow">
    <div class="brand-block">
      <img src="icons/icon.svg" alt="" width="64" height="64">
      <h1>勤務登録</h1>
      <p class="muted">勤務を入力して、Googleカレンダーに登録します。</p>
    </div>

    <p id="load-wait" class="message hidden" aria-live="polite">読み込み中です。少し待ってから、もう一度押してください(しばらくたっても変わらないときは、ページを読み直してください)。</p>
    <p id="load-error" class="message error hidden" aria-live="polite">画面を読み込めませんでした。電波の良いところで、ページを読み直してください。広告ブロック(コンテンツブロッカー)を使っているときは、このサイトではオフにしてください。</p>

    <div class="tabs" role="tablist">
      <button id="tab-user" role="tab" aria-selected="true" class="tab active">利用者</button>
      <button id="tab-admin" role="tab" aria-selected="false" class="tab">管理</button>
    </div>

    <!-- 利用者 -->
    <form id="user-form" class="card" autocomplete="on" onsubmit="if (!window.shiftflowReady &amp;&amp; document.getElementById('load-error').classList.contains('hidden')) document.getElementById('load-wait').classList.remove('hidden'); return false;">
      <!-- お知らせ(管理画面から出す)。読めないとき・0件のときは出さない -->
      <section id="login-notices" class="notices hidden" aria-label="お知らせ"></section>
      <label for="employee-no">社員番号(7桁)</label>
      <input id="employee-no" data-digits name="username" inputmode="numeric" maxlength="7" autocomplete="username" placeholder="1234567" required>
      <label for="pin">PIN(4桁の数字)</label>
      <input id="pin" data-digits name="password" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" placeholder="••••" required>
      <button id="user-login" class="primary block" type="submit">ログイン</button>
      <p id="user-message" class="message" aria-live="polite"></p>
      <p class="muted center">はじめての方は <a href="register.html">新規登録</a> ・ <a href="help.html">使い方</a> ・ <a href="terms.html">利用上の注意</a></p>
      <p class="muted center">ログインできないときは <a href="contact.html">お問い合わせ</a></p>
    </form>

    <!-- 管理 -->
    <form id="admin-form" class="card hidden" autocomplete="on" onsubmit="if (!window.shiftflowReady &amp;&amp; document.getElementById('load-error').classList.contains('hidden')) document.getElementById('load-wait').classList.remove('hidden'); return false;">
      <label for="admin-password">管理用パスワード</label>
      <input id="admin-password" name="password" type="password" autocomplete="current-password" required>
      <button id="admin-login" class="primary block" type="submit">管理画面に入る</button>
      <p id="admin-message" class="message" aria-live="polite"></p>
    </form>
  </main>
  <!-- 読み込めないとき(電波・広告ブロック)は、上の load-error を出す。読み込み中に押したときは load-wait。フォームは onsubmit で送らない -->
  <script type="module" src="js/index.js?v=dev" onerror="document.getElementById('load-wait').classList.add('hidden'); document.getElementById('load-error').classList.remove('hidden')"></script>
</body>
</html>
