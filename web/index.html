<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ログイン - shiftflow</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#1a73e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="勤務登録">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="page narrow">
    <div class="brand-block">
      <img src="icons/icon.svg" alt="" width="64" height="64">
      <h1>勤務登録</h1>
      <p class="muted">勤務を入力して、Googleカレンダーに登録します。</p>
    </div>

    <div class="tabs" role="tablist">
      <button id="tab-user" role="tab" aria-selected="true" class="tab active">利用者</button>
      <button id="tab-admin" role="tab" aria-selected="false" class="tab">管理</button>
    </div>

    <!-- 利用者 -->
    <form id="user-form" class="card" autocomplete="on">
      <label for="employee-no">社員番号(7桁)</label>
      <input id="employee-no" name="username" inputmode="numeric" maxlength="7" autocomplete="username" placeholder="1234567" required>
      <label for="pin">PIN(6桁の数字)</label>
      <input id="pin" name="password" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" placeholder="••••••" required>
      <button id="user-login" class="primary block" type="submit" disabled>ログイン</button>
      <p id="user-message" class="message"></p>
      <p class="muted center">はじめての方は <a href="register.html">新規登録</a> ・ <a href="help.html">使い方</a></p>
    </form>

    <!-- 管理 -->
    <form id="admin-form" class="card hidden" autocomplete="on">
      <label for="admin-password">管理用パスワード</label>
      <input id="admin-password" name="password" type="password" autocomplete="current-password" required>
      <button id="admin-login" class="primary block" type="submit" disabled>管理画面に入る</button>
      <p id="admin-message" class="message"></p>
    </form>
  </main>
  <script type="module" src="js/index.js"></script>
</body>
</html>
