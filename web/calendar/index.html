<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>shiftflowカレンダー</title>
  <meta name="theme-color" content="#fafafa">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="shiftflowカレンダー">
  <link rel="stylesheet" href="calendar.css?v=dev">
</head>
<body>
  <div class="app" id="app">
    <header class="top">
      <div class="ym" aria-live="polite"><span class="y" id="ty"></span><span class="m" id="tm"></span></div>
      <span class="sp"></span>
      <button class="ib" id="btn-imp" aria-label="重要メモ"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l2.5 5.2 5.7.8-4.1 4 1 5.7L12 16.5l-5.1 2.7 1-5.7-4.1-4 5.7-.8z"/></svg></button>
      <button class="ib" id="btn-gal" aria-label="画像"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.7"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg></button>
      <button class="ib nav" id="prev" aria-label="前の月"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="ib nav" id="next" aria-label="次の月"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
      <button class="ib todayic" id="today" aria-label="今日へ"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9h17M8 3v4M16 3v4" stroke-linecap="round"/><text id="today-d" x="12" y="17.6" text-anchor="middle" font-size="8.5" font-weight="700" fill="currentColor" stroke="none"></text></svg></button>
    </header>
    <div class="bar2"><div class="chips" id="chips" role="group" aria-label="ラベルの表示"></div><a class="link" href="../input.html" id="to-input">勤務入力 ›</a></div>
    <p class="banner" id="banner" hidden></p>
    <div class="wd" aria-hidden="true"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div>
    <main class="cal" id="cal"><div id="weeks"></div></main>
    <div class="tray" id="tray" hidden></div>
    <div class="tray markbar" id="markbar" hidden></div>
    <nav class="tabs" aria-label="メニュー">
      <button class="tab on" id="tab-today"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9h17M8 3v4M16 3v4" stroke-linecap="round"/></svg><span>カレンダー</span></button>
      <button class="tab" id="tab-stamp"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 14.2c1 1.6 2.2 2.3 3.5 2.3s2.5-.7 3.5-2.3"/><circle cx="9" cy="10" r=".6" fill="currentColor"/><circle cx="15" cy="10" r=".6" fill="currentColor"/></svg><span>スタンプ</span></button>
      <button class="tab plus" id="tab-new" aria-label="予定を追加"><span class="plusc"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></button>
      <button class="tab" id="tab-todo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12.5l3 3 5-6"/></svg><span>TODO</span></button>
      <button class="tab" id="tab-settings"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>設定</span></button>
    </nav>
  </div>
  <div class="viewer" id="viewer" hidden><img id="viewer-img" alt=""><p id="viewer-cap"></p></div>
  <div class="scrim" id="scrim" hidden></div>
  <aside class="panel" id="panel" hidden aria-live="polite"></aside>
  <p class="boot" id="boot" role="status">読み込み中…</p>
  <script type="module" src="cal-main.js?v=dev" onerror="var e=document.getElementById('boot'); e.textContent='画面を読み込めませんでした。電波の良いところで、ページを読み直してください。'; e.className='boot error';"></script>
</body>
</html>
