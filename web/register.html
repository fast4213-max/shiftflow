<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>新規登録 - shiftflow</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#1a73e8">
  <link rel="stylesheet" href="css/app.css?v=dev">
</head>
<body>
  <main class="page narrow">
    <h1>新規登録</h1>
    <p class="muted">登録すると、そのまま使えます。</p>
    <p id="load-wait" class="message hidden">読み込み中です。少し待ってから、もう一度押してください(しばらくたっても変わらないときは、ページを読み直してください)。</p>
    <p id="load-error" class="message error hidden">画面を読み込めませんでした。電波の良いところで、ページを読み直してください。広告ブロック(コンテンツブロッカー)を使っているときは、このサイトではオフにしてください。</p>
    <form id="form" class="card" autocomplete="off" onsubmit="if (!window.shiftflowReady &amp;&amp; document.getElementById('load-error').classList.contains('hidden')) document.getElementById('load-wait').classList.remove('hidden'); return false;">
      <label for="employee-no">社員番号(7桁)</label>
      <input id="employee-no" data-digits name="username" inputmode="numeric" maxlength="7" autocomplete="username" placeholder="1234567" required>
      <div class="two">
        <div>
          <label for="family-name">名字</label>
          <input id="family-name" maxlength="30" required>
        </div>
        <div>
          <label for="given-name">名前</label>
          <input id="given-name" maxlength="30" required>
        </div>
      </div>
      <label for="pin">PIN(ログインに使う4桁の数字)</label>
      <input id="pin" data-digits name="password" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" passwordrules="minlength: 4; maxlength: 4; required: digit;" required>
      <label for="pin2">PIN(もう一度)</label>
      <input id="pin2" data-digits type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" passwordrules="minlength: 4; maxlength: 4; required: digit;" required>
      <p class="muted">PINは忘れないようにしてください。忘れたときは、管理者に再設定を頼みます。</p>
      <label for="shared">共通パスワード</label>
      <input id="shared" class="secret" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" required>
      <p class="muted">管理者から教えてもらったパスワードです(登録のときだけ使います)。</p>
      <button id="submit" class="primary block" type="submit" disabled>登録する</button>
      <p id="message" class="message"></p>
    </form>
    <p class="muted center"><a href="index.html">ログインに戻る</a> ・ <a href="help.html">使い方</a></p>
  </main>
  <script type="module" src="js/register.js?v=dev" onerror="document.getElementById('load-wait').classList.add('hidden'); document.getElementById('load-error').classList.remove('hidden')"></script>
</body>
</html>
